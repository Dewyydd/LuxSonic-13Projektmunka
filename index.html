<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LuxSonic — Navbar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAVBAR -->
<header class="lux-navbar" id="luxNavbar">
  <div class="container-fluid">
    <button class="lux-menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#luxMenu" aria-controls="luxMenu">
      <span class="bar-icon"><span></span><span></span><span></span></span>
      <span class="d-none d-sm-inline">Menu</span>
    </button>

    <a class="lux-brand" href="#">LuxSonic</a>

    <div class="lux-actions">
      <button class="lux-icon-btn" type="button" aria-label="Login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- OFFCANVAS MENU -->
<div class="offcanvas offcanvas-start lux-offcanvas" tabindex="-1" id="luxMenu">
  <div class="offcanvas-header">
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <nav class="nav flex-column">
      <a class="nav-link" href="#">Speakers</a>
      <a class="nav-link" href="#">Headphones</a>
      <a class="nav-link" href="#">Televisions</a>
      <a class="nav-link" href="#">Accessories</a>
      <a class="nav-link" href="#">About</a>
    </nav>
  </div>
</div>

<!-- demo hero content -->
<section class="hero">
  <h1>Form. Function. Feeling.</h1>
</section>
<section class="hero">
  <h1>Form. Function. Feeling.</h1>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts.js"></script>
</body>
</html>
